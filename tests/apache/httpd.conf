ServerRoot "/etc/httpd"
Listen 8081
Listen 8082
Listen 8083
Listen 8084
Listen 8085
Listen 8086
Listen 8087
Listen 8088
Listen 8089

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule dir_module modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so

User apache
Group apache

ErrorLog /var/log/httpd/error_log
LogLevel warn
TypesConfig /etc/mime.types

DirectoryIndex index.html index.php

# PHP-FPM handler
<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
</FilesMatch>

# ============================================================
# Port 8081: Simple (HTML only)
# ============================================================
<VirtualHost *:8081>
    DocumentRoot /sites/simple
    <Directory /sites/simple>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8082: Drupal
# ============================================================
<VirtualHost *:8082>
    DocumentRoot /sites/drupal
    <Directory /sites/drupal>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8083: WordPress
# ============================================================
<VirtualHost *:8083>
    DocumentRoot /sites/wordpress/wordpress
    <Directory /sites/wordpress/wordpress>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8084: Joomla
# ============================================================
<VirtualHost *:8084>
    DocumentRoot /sites/joomla
    <Directory /sites/joomla>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8085: Grav
# ============================================================
<VirtualHost *:8085>
    DocumentRoot /sites/grav
    <Directory /sites/grav>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8086: WordPress Multisite
# ============================================================
<VirtualHost *:8086>
    DocumentRoot /sites/wordpress-multy
    <Directory /sites/wordpress-multy>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8087: Directive unit tests (HTML)
# ============================================================
<VirtualHost *:8087>
    DocumentRoot /sites
    <Directory /sites>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8088: Directive unit tests (PHP)
# ============================================================
<VirtualHost *:8088>
    DocumentRoot /sites
    <Directory /sites>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ============================================================
# Port 8089: HtaccessName test
# ============================================================
<VirtualHost *:8089>
    DocumentRoot /sites/test-htaccessname
    AccessFileName .webconfig
    <Directory /sites/test-htaccessname>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
