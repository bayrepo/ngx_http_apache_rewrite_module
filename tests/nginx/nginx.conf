load_module modules/ngx_http_apache_rewrite_module.so;

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ============================================================
    # Site 1: simple (HTML only, no PHP) — port 8081
    # ============================================================
    server {
        listen 8081;
        server_name localhost;

        root /sites/simple;
        index index.html;

        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex off;

        location / {
            RewriteEngine On;
        }
    }

    # ============================================================
    # Site 2: drupal — port 8082
    # ============================================================
    server {
        listen 8082;
        server_name localhost;

        root /sites/drupal;
        index index.php;

        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex on;

        location / {
            RewriteEngine On;
        }

        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ============================================================
    # Site 3: wordpress — port 8083
    # ============================================================
    server {
        listen 8083;
        server_name localhost;

        root /sites/wordpress/wordpress;
        index index.php;

        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex on;

        location / {
            RewriteEngine On;
        }

        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ============================================================
    # Site 4: joomla — port 8084
    # ============================================================
    server {
        listen 8084;
        server_name localhost;

        root /sites/joomla;
        index index.php;

        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex on;

        location / {
            RewriteEngine On;
        }

        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ============================================================
    # Site 5: grav — port 8085
    # ============================================================
    server {
        listen 8085;
        server_name localhost;

        root /sites/grav;
        index index.php;

        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex on;

        location / {
            RewriteEngine On;
        }

        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ============================================================
    # Site 6: wordpress-multy — port 8086
    # ============================================================
    server {
        listen 8086;
        server_name localhost;

        root /sites/wordpress-multy;
        index index.php;

        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex on;

        location / {
            RewriteEngine On;
        }

        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ============================================================
    # Unit tests for directives — port 8087 (HTML only)
    # Single root /sites, each test in its own subdirectory
    # ============================================================
    server {
        listen 8087;
        server_name localhost;

        root /sites;
        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex off;

        # Server-level directives
        RewriteMap lc int:tolower;
        RewriteMap uc int:toupper;
        RewriteMap esc int:escape;
        RewriteMap unesc int:unescape;

        location / {
            RewriteEngine On;
        }
    }

    # ============================================================
    # PHP directive tests — port 8088
    # ============================================================
    server {
        listen 8088;
        server_name localhost;

        root /sites;
        HtaccessEnable on;
        RewriteEngine On;
        FallbackToIndex off;

        location / {
            RewriteEngine On;
        }

        location ~* \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ============================================================
    # HtaccessName test — port 8089 (server-level directive)
    # ============================================================
    server {
        listen 8089;
        server_name localhost;

        root /sites/test-htaccessname;
        HtaccessEnable on;
        HtaccessName .webconfig;
        RewriteEngine On;
        FallbackToIndex off;

        location / {
            RewriteEngine On;
        }
    }
}
